<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js" defer></script>
    <style>
        #map {
            height: 100vh;
            width: 100vw;
        }

        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="map"></div>
<!-- ... -->
<script type="module">
    (async () => {
        const map = L.map('map');
        L.tileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data &copy; <a href="http://www.osm.org">OpenStreetMap</a>'
        }).addTo(map);

        // URL to your GPX file or the GPX itself as a XML string.
        const options = {
            async: true,
            polyline_options: {color: 'red'},
        };

        const X = L.GPX;
        X.prototype._load_xml = function (url, cb, options, async) {
            fetch(url).then(r => r.blob())
                .then(r => new Response(r.stream().pipeThrough(new DecompressionStream('gzip'))).text())
                .then(r => {
                    cb(new DOMParser().parseFromString(r, 'text/xml'), options)
                })
        }

        const gpx = new X('./all.gpx.gz', options).on('loaded', (e) => {
            map.fitBounds(e.target.getBounds());
        }).addTo(map);
    })();
</script>
</body>
</html>
